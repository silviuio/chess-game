<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#171c19">
    <title>Six by Six</title>
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">ROUND</span>
        <div class="hud">
          <button id="hints" class="hints" type="button" role="switch" aria-checked="false" title="Show the knight's valid moves"><span class="track" aria-hidden="true"><span class="thumb"></span></span><span class="label">Hints</span></button>
          <h1 class="counter" aria-label="Round"><output id="round" aria-live="polite">1</output><span id="round-total">/5</span></h1>
          <button id="restart" class="restart" type="button" aria-label="Restart"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95L19 9"/><path d="M19 4v5h-5"/></svg></button>
        </div>
        <div id="timer" class="timer" role="timer" data-state="idle">0:00.0</div>
      </header>

      <div id="board">
        <div id="start" class="overlay">
          <p class="overlay-eyebrow">5 rounds · 5 coins each</p>
          <p class="overlay-text">New coins appear every round, and the clock starts with them.</p>
          <button id="start-button" class="primary-button" type="button">Start</button>
        </div>
        <div id="banner" class="overlay banner" role="status" hidden>
          <p id="banner-title" class="banner-title">Round 2</p>
          <p id="banner-detail" class="banner-detail"></p>
        </div>
      </div>
    </main>

    <dialog id="result" class="result" aria-labelledby="result-title">
      <p id="result-title" class="result-title">All 5 rounds done</p>
      <ol id="result-rounds" class="result-rounds"></ol>
      <p class="result-total-label">Total</p>
      <p class="result-time"><output id="result-total">0:00.00</output></p>
      <button id="result-restart" class="primary-button" type="button" autofocus><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95L19 9"/><path d="M19 4v5h-5"/></svg>Restart</button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
